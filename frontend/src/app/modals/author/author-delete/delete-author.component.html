<h2 mat-dialog-title>Eliminar autor</h2>
<mat-dialog-content>
<p>¿Deseas eliminar "{{autor.nombre}}"?</p>
<div class="buttons">
<button type="button" class="btn" (click)="closeDialog()">Cancelar</button>
<button type="submit" class="btn btn-success" (click)="deleteAuthor()">Eliminar</button>
</div>
</mat-dialog-content>
