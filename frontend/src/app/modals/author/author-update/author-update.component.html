<h2 mat-dialog-title>Modificar autor</h2>
<mat-dialog-content>
    <form [formGroup]="formUpdateAuthor" (submit)="updateAuthor()">
        <!-- <div class="form-group" formGroupName="autor"> -->
            <div class="form-group" >
            <label class="control-label" for="nombre">Nombre </label>
            <!-- <input id="nombre" type="text" formControlName="nombre" class="form-control" required> -->
            <input id="nombre" type="text" formControlName="nombre" class="form-control" required>
        </div>
        <div class="form-group">
            <button type="button" class="btn" (click)="closeForm()">Atrás</button>
            <button type="submit" class="btn btn-success">Actualizar</button>
        </div>
    </form>
</mat-dialog-content>
