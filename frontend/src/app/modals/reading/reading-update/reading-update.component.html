<h2 mat-dialog-title>Añadir libro Update</h2>
<div mat-dialog-content>

        <form [formGroup]="formUpdateReading" (submit)="changeSituation()">
                <div class="form-group">

                        <input type="hidden" formControlName="puntuacion" id="puntuacion" class="form-control">

                </div>
                <div class="form-group" formGroupName="estado">


                        <select formControlName="id" class="estado" (change)="captureSelect($event)">
                                @for (estado of estados; track estado.id){


                                <option [value]="estado.id">
                                        {{ estado.situacion}}
                                </option>
                                }

                        </select>
                </div>
                @if((lectura.estado.id===2 && selectedOption!=="1" && selectedOption!=="3") || (lectura.estado.id===3 &&
                selectedOption=="2")) {
                <mat-toolbar color="primary"></mat-toolbar>
                @for (star of ratingArray; track star; let index = $index){
                <mat-icon (mouseenter)="setStar(index)" [ngClass]="{checked:selectedStar>index}"
                        (mouseleave)="unselectStar()" (click)="rating(index)">star</mat-icon>
                }
                }

                <mat-dialog-actions>
                        <button type="button" class="btn " (click)="closeForm()">Atrás</button>
                        <button type="submit" class="btn btn-success">Añadir</button>

                </mat-dialog-actions>

        </form>

</div>
