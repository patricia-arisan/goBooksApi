<h2 mat-dialog-title>Eliminar género</h2>
<mat-dialog-content>
<p>¿Deseas eliminar "{{genero.nombre}}"?</p>
<div class="buttons">
<button type="button" class="btn" (click)="closeDialog()">Cancelar</button>
<button type="submit" class="btn btn-success" (click)="deleteGenre()">Eliminar</button>
</div>
</mat-dialog-content>
