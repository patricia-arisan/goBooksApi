<h2 mat-dialog-title class="title">Editar libro</h2>
<mat-dialog-content>
  <!-- Formulario para actualizar el libro -->
  <form [formGroup]="formUpdate" (submit)="update()">
    <div class="form-group">
      <label class="control-label" for="name">Título*</label>
      <input type="text" id="name" class="form-control" formControlName="nombre">
      <!-- Comprobaciones del input -->
      @if (name.invalid && (name.dirty || name.touched)) {
      <div class="alert">
        <!-- Comprobacion para evitar el campo vacio -->
        @if (name.hasError('required')) {
        <svg fill="none" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
          <path id="error-circle"
            d="M32.085,56.058c6.165,-0.059 12.268,-2.619 16.657,-6.966c5.213,-5.164 7.897,-12.803 6.961,-20.096c-1.605,-12.499 -11.855,-20.98 -23.772,-20.98c-9.053,0 -17.853,5.677 -21.713,13.909c-2.955,6.302 -2.96,13.911 0,20.225c3.832,8.174 12.488,13.821 21.559,13.908c0.103,0.001 0.205,0.001 0.308,0Zm-0.282,-4.003c-9.208,-0.089 -17.799,-7.227 -19.508,-16.378c-1.204,-6.452 1.07,-13.433 5.805,-18.015c5.53,-5.35 14.22,-7.143 21.445,-4.11c6.466,2.714 11.304,9.014 12.196,15.955c0.764,5.949 -1.366,12.184 -5.551,16.48c-3.672,3.767 -8.82,6.016 -14.131,6.068c-0.085,0 -0.171,0 -0.256,0Zm-12.382,-10.29l9.734,-9.734l-9.744,-9.744l2.804,-2.803l9.744,9.744l10.078,-10.078l2.808,2.807l-10.078,10.079l10.098,10.098l-2.803,2.804l-10.099,-10.099l-9.734,9.734l-2.808,-2.808Z">
          </path>
        </svg>
        Título requerido.
        }
        <!-- Comprobacion de espacios en el nombre -->
        @if (name.hasError('pattern')) {
        <svg fill="none" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
          <path id="error-circle"
            d="M32.085,56.058c6.165,-0.059 12.268,-2.619 16.657,-6.966c5.213,-5.164 7.897,-12.803 6.961,-20.096c-1.605,-12.499 -11.855,-20.98 -23.772,-20.98c-9.053,0 -17.853,5.677 -21.713,13.909c-2.955,6.302 -2.96,13.911 0,20.225c3.832,8.174 12.488,13.821 21.559,13.908c0.103,0.001 0.205,0.001 0.308,0Zm-0.282,-4.003c-9.208,-0.089 -17.799,-7.227 -19.508,-16.378c-1.204,-6.452 1.07,-13.433 5.805,-18.015c5.53,-5.35 14.22,-7.143 21.445,-4.11c6.466,2.714 11.304,9.014 12.196,15.955c0.764,5.949 -1.366,12.184 -5.551,16.48c-3.672,3.767 -8.82,6.016 -14.131,6.068c-0.085,0 -0.171,0 -0.256,0Zm-12.382,-10.29l9.734,-9.734l-9.744,-9.744l2.804,-2.803l9.744,9.744l10.078,-10.078l2.808,2.807l-10.078,10.079l10.098,10.098l-2.803,2.804l-10.099,-10.099l-9.734,9.734l-2.808,-2.808Z">
          </path>
        </svg>
        El título no puede estar vacío.
        }
      </div>
      }
      <!-- Comprobacion de la existencia del nombre -->
      @if (formUpdate.hasError('foundBook')) {
      <div class="alert">
        <svg fill="none" viewBox="0 0 64 64" version="1.1" xmlns="http://www.w3.org/2000/svg">
          <path id="error-circle"
            d="M32.085,56.058c6.165,-0.059 12.268,-2.619 16.657,-6.966c5.213,-5.164 7.897,-12.803 6.961,-20.096c-1.605,-12.499 -11.855,-20.98 -23.772,-20.98c-9.053,0 -17.853,5.677 -21.713,13.909c-2.955,6.302 -2.96,13.911 0,20.225c3.832,8.174 12.488,13.821 21.559,13.908c0.103,0.001 0.205,0.001 0.308,0Zm-0.282,-4.003c-9.208,-0.089 -17.799,-7.227 -19.508,-16.378c-1.204,-6.452 1.07,-13.433 5.805,-18.015c5.53,-5.35 14.22,-7.143 21.445,-4.11c6.466,2.714 11.304,9.014 12.196,15.955c0.764,5.949 -1.366,12.184 -5.551,16.48c-3.672,3.767 -8.82,6.016 -14.131,6.068c-0.085,0 -0.171,0 -0.256,0Zm-12.382,-10.29l9.734,-9.734l-9.744,-9.744l2.804,-2.803l9.744,9.744l10.078,-10.078l2.808,2.807l-10.078,10.079l10.098,10.098l-2.803,2.804l-10.099,-10.099l-9.734,9.734l-2.808,-2.808Z">
          </path>
        </svg>
        Título ya registrado.
      </div>
      }
    </div>

    <div class="form-group" formGroupName="autor">
      <label class="control-label" for="author">Autor</label>
      <select formControlName="id" id="author">
        @for (autor of authors; track autor.id) {
        <option [value]="autor.id">{{autor.nombre}}</option>
        }
      </select>
      <!-- Boton para editar autor -->
      <button type="button" class="edit-button" matButton="elevated" (click)="openUpdateAuthorDialog('0ms', '0ms')">
        <img src="/assets/icons/edit.png" class="edit" alt="Editar" />
      </button>
    </div>

    <div class="form-group" formGroupName="editorial">
      <label class="control-label" for="publisher">Editorial</label>
      <select formControlName="id" id="publisher">
        @for (editorial of publishers; track editorial) {
        <option [value]="editorial.id">{{editorial.nombre}}</option>
        }
      </select>
      <!-- Boton para editar editorial -->
      <button type="button" class="edit-button" matButton="elevated" (click)="openUpdatePublisherDialog('0ms', '0ms')">
        <img src="/assets/icons/edit.png" class="edit" alt="Editar" />
      </button>
    </div>

    <div class="form-group" formGroupName="genero">
      <label class="control-label" for="genre">Género</label>
      <select formControlName="id" id="genre">
        @for (genero of genres; track genero) {
        <option [value]="genero.id">{{genero.nombre}}</option>
        }
      </select>
      <!-- Boton para editar genero -->
      <button type="button" class="edit-button" matButton="elevated" (click)="openUpdateGenreDialog('0ms', '0ms')">
        <img src="/assets/icons/edit.png" class="edit" alt="Editar" />
      </button>
    </div>

    <mat-dialog-actions class="buttons">
      <button type="button" class="btn" (click)="closeForm()">Atrás</button>
      <button type="submit" class="btn btn-success" [disabled]="formUpdate.invalid">Actualizar</button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
