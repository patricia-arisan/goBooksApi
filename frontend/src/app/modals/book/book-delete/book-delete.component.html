<h2 mat-dialog-title class="title">Eliminar libro</h2>
<mat-dialog-content>
    <p>¿Deseas eliminar "{{book.nombre}}"?</p>
    <mat-dialog-actions class="buttons">
        <button type="button" class="btn" (click)="closeDialog()">Cancelar</button>
        <button type="submit" class="btn btn-success" (click)="deleteBook()">Eliminar</button>
    </mat-dialog-actions>
</mat-dialog-content>
