<!-- Header con navegacion para el usuario -->
<app-header-user></app-header-user>
<!-- Cuerpo de pagina Mejor valorados -->
<div class="books">
  <h3>Libros mejor valorados</h3>
  <!-- Listado de libros de mayor a menor puntuacion -->
  <div class="book-list">
    <!-- Recorrido del array de libros mostrando la seleccion extraida de items del paginador-->
    @for (libro of trackedBooks; track libro) {
    <div class="book">
      <a [routerLink]="['/books/book-section',libro.id]"><img src="{{libro.portada}}" id="cover" 
          alt="{{libro.nombre}}" /></a>
      <p class="name"><a [routerLink]="['/books/book-section',libro.id]">{{libro.nombre}}</a></p>
    </div>
    }
  </div>
  <!-- Seccion de paginacion de la lista de libros -->
  <mat-paginator class="paginator" [length]="totalItems" [pageSize]="pageSize" [pageIndex]="pageIndex"
    [pageSizeOptions]="[16, 32, 40]" aria-label="Select page" (page)="onPageChange($event)">
  </mat-paginator>
</div>
