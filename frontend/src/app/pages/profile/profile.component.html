<app-header-user></app-header-user>
    <main  class="cs-page-wrapper">
   
    
 
        <section class="container pt-3 pt-lg-4 pb-5 pb-lg-6">
            <div class="row pb-2 pb-lg-0">
  
    <aside class="col-xl-3 ">
     
        <div class="sidebar-sticky" data-sidebar-sticky-options='{
          "topSpacing": 120,
          "minWidth": 991
        }'>
          <div class="sidebar-sticky-inner">
            <div class="card">
              <div class="card-body" >
                
                <h5 class="card-title mb-1">  </h5>
                

                <a href="#account-menu" class="btn btn-primary btn-block d-lg-none" data-toggle="collapse"></a>
              </div>
              <div id="account-menu" class="collapse d-lg-block">
                <div class="list-group list-group-flush border-top">
                  <a  routerLinkActive="active" class="list-group-item list-group-item-action d-flex align-items-center active">
                   
                    <span>Mi perfil : </span>
                    <br>  
               

                  </a>
                  <a href="#" class="list-group-item list-group-item-action d-flex align-items-center">
                   
                    <span>Eliminar cuenta</span>
                  </a>
                  <a href="#" class="list-group-item list-group-item-action d-flex align-items-center">
                   
                    <span>Actualizar </span>
                    <span class="badge badge-warning ml-auto"></span>
                  </a>
                  <a href="#" class="list-group-item list-group-item-action d-flex align-items-center">
                    
                    
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>



    </aside>

              <div class="col-lg-8 ml-auto">
                <div class="d-flex align-items-center justify-content-between mb-4 pb-1 pb-sm-3">
                  <h1 class="h2 mb-0">Mi perfil</h1>
             
                </div>
                <form [formGroup]="formUpdate" (submit)="update()">
                  <div class="row pb-3">
                    <div class="col-sm-6 form-group">
                      <label for="ac-fn">Nombre</label>
                      <input type="text" id="nombre" class="form-control form-control-lg" formControlName="nombre">
                      
                      <div>{{user.nombre}}</div>
                    </div>
                    <div class="col-sm-6 form-group">
                      <label for="ac-ln">Apellido</label>
                      <input type="text"  class="form-control form-control-lg"  formControlName="apellido">
                    </div>
                    <div class="col-sm-6 form-group">
                      <label >Correo electrónico</label>
                     

                      <input type="text"  class="form-control form-control-lg" formControlName="username">
                    </div>
                    <div class="col-sm-6 form-group">
                      <label >Contraseña</label>
                      <input type="password"  class="form-control form-control-lg" formControlName="password">
                    </div>
                 
                      <div class="col-sm-6 form-group">
                        <label >Fecha Nacimiento</label>
                        <input type="date"  class="form-control form-control-lg" formControlName="fechaNacimiento">
                      </div>
                            
<div class="form-group">
                    <label class="control-label" for="id"> </label> <input
                        id="id" type="hidden" formControlName="id" class="form-control" 
                        autofocus="autofocus"> 
                </div>

                <div class="form-group">
                    <label class="control-label" for="rol"> </label> <input
                        id="rol" type="hidden" formControlName="rol" class="form-control" 
                        autofocus="autofocus">
                </div>


                  </div>
                  <button type="submit" class="btn btn-primary btn-lg">&nbsp;Actualizar&nbsp;</button>
                </form>

                
                
              </div>
            </div>
          </section>
    
    </main>
