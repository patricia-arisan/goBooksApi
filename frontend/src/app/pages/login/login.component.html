<div class="container">
<div class="row">
        <div class="col-md-6 col-md-offset-3">
            <h3>Inicio de sesión</h3>
           

              
            <form [formGroup]="formLogin" (submit)="login()">
                <div class="form-group">
                    <label  for="username"> Correo electrónico</label>
                    <input id="email" type="text" formControlName="username" class="form-control"
                        required autofocus="autofocus" placeholder="Introducir email">
                </div>

                <div class="form-group">
                    <label  for="password">Contraseña </label> <input id="password" type="password" formControlName="password" class="form-control" required
                        autofocus="autofocus" placeholder="Introducir password">
                </div>
                <div class="form-group">
                    <div class="row">
                        <div class="col-md-6 col-md-offset-3">
                            <input type="submit" class="form-control btn btn-primary" name="login-submit" id="login-submit"
                                value="Iniciar sesión" />
                        </div>
                    </div>
                </div>
            </form>
            <div class="form-group">
                <span>Si eres nuevo usuario  regístrate
                        <a routerLink="/registration">aqui</a></span>
                        
            </div>
        </div>
</div>
</div>
