<div class="header">
  <div class="header-content">
    <div id="header-right">
      <a routerLink="/admin-home"><img src="/assets/logo/ibooks.png" alt="Logo" id="logo" /></a>
      <!-- Menu desplegable para pantallas de menor dimension, con navegacion del administrador -->
      <div class="menu">
        <button type="button" (click)="toggleViewMenu()" class="view"><img src="/assets/icons/list-menu.png" alt="Menu"
            id="menu" /></button>
        @if(!hideMenu){
        <ul class="menu-options">
          <li class="option"><a routerLink="/admin-home">Home</a></li>
          <li class="option"><a routerLink="/admin-books">Libros</a></li>
          <li class="option"><a routerLink="/admin-authors">Autores</a></li>
          <li class="option"><a routerLink="/admin-genres">Géneros</a></li>
          <li class="option"><a routerLink="/admin-publishers">Editoriales</a></li>
          <li class="option"><button (click)="logout()">Cerrar sesión</button></li>
        </ul>
        }
      </div>

      <h1>GoBooks</h1>
    </div>

    <div class="header-left">
      <div class="account-options">
        <!-- Boton con menu con desplegable de opciones de la cuenta del administrador -->
        <div class="options">
          <button type="button" (click)="toggleViewAccount()" class="account">
            <img src="/assets/user/user.png" alt="Usuario" id="user" />
            <span class="username">{{user.nombre}}</span>
          </button>
          @if(!hideAccount){
          <ul class="options-admin">
            <li class="option-admin"><button (click)="logout()">Cerrar sesión</button></li>
          </ul>
          }
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Seccion principal con la navegacion del administrador, para pantallas grandes -->
<div class="routes">
  <nav class="d-flex justify-content-center py-3">
    <ul class="nav nav-pills">
      <li class="nav-item"><a routerLink="/admin-home" class="nav-link active">Home</a></li>
      <li class="nav-item"><a routerLink="/admin-books" class="nav-link">Libros</a></li>
      <li class="nav-item"><a routerLink="/admin-authors" class="nav-link">Autores</a></li>
      <li class="nav-item"><a routerLink="/admin-genres" class="nav-link">Géneros</a></li>
      <li class="nav-item"><a routerLink="/admin-publishers" class="nav-link">Editoriales</a></li>
      <li class="nav-item"><button class="nav-link" (click)="logout()">Cerrar sesión</button></li>
    </ul>
  </nav>
</div>
