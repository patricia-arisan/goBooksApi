<div class="header">
  <div class="header-content">
    <div class="header-right">
      <a routerLink="/home"><img src="/assets/logo/ibooks.png" alt="Logo" id="logo" /></a>
      <!-- Menu desplegable para pantallas de menor dimension, con navegacion del usuario -->
      <div class="menu">
        <button type="button" (click)="toggleViewMenu()" class="view"><img src="/assets/icons/list-menu.png" alt="Menu"
            id="menu" /></button>
        @if (!hideMenu) {
        <ul class="menu-options">
          <li class="option"><a routerLink="/home">Home</a></li>
          <li class="option"><a routerLink="/books">Libros</a></li>
          <li class="option"><a routerLink="/readings">Mis libros</a></li>
          <li class="option"><a routerLink="/profile">Perfil</a></li>
          <li class="option"><button (click)="logout()">Cerrar sesión</button></li>
        </ul>
        }
      </div>

      <h1>GoBooks</h1>
    </div>

    <div class="header-left">
      <div class="account-options">
        <!-- Boton con menu con desplegable de opciones de la cuenta del usuario -->
        <div class="options">
          <button type="button" (click)="toggleViewAccount()" class="account">
            <img src="/assets/user/user.png" alt="Usuario" id="user" />
            <span class="username">{{user.nombre}}</span>
          </button>
          @if (!hideAccount) {
          <ul class="options-user">
            <li class="option-user"><a routerLink="/profile">Mi cuenta</a></li>
            <li class="option-user"><button (click)="logout()">Cerrar sesión</button></li>
          </ul>
          }
        </div>
      </div>
    </div>
  </div>
</div>
<!-- Seccion principal con la navegacion del usuario, para pantallas grandes -->
<div class="routes">
  <nav class="d-flex justify-content-center py-3">
    <ul class="nav nav-pills">
      <li class="nav-item"><a routerLink="/home" class="nav-link active">Home</a></li>
      <li class="nav-item"><a routerLink="/books" class="nav-link">Libros</a></li>
      <li class="nav-item"><a routerLink="/readings" class="nav-link">Mis libros</a></li>
      <li class="nav-item"><a routerLink="/profile" class="nav-link">Perfil</a></li>
      <li class="nav-item"><button class="nav-link" (click)="logout()">Cerrar sesión</button></li>
    </ul>
  </nav>
</div>
