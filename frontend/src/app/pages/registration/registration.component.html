<div id="cabeceraBooks">    
        
        <h1>GoBooks</h1>
    </div>    
    <div class="login">
       
    </div>


<br><br>
<div class="container">
    <div class="row">
        <div class="col-md-6 col-md-offset-3">
            

            <h3>Registrate</h3>
            <form [formGroup]="formNewUser" (submit)="register()" > <!--(ngSubmit)="register()"-->
            
                <div class="form-group">
                    <label class="control-label" for="id"> </label> <input
                        id="id" type="hidden" formControlName="id" class="form-control" 
                        autofocus="autofocus"> 
                </div>
                 
                        
                
                <div class="form-group">
                    <label class="control-label" for="nombre">Nombre : </label> 
                    <input id="nombre" type="text" formControlName="nombre" required class="form-control" required autofocus="autofocus">
                    
                </div>

                <div class="form-group">
                    <label class="control-label" for="apellido">Apellido : </label> <input
                        id="apellido" formControlName="apellido" class="form-control" 
                        required autofocus="autofocus">
                </div>

                <div class="form-group">
                    <label class="control-label" for="email">Email : </label> <input
                        id="email" type="email" formControlName="email" class="form-control" 
                        required autofocus="autofocus">
                </div>

                <div class="form-group">
                    <label class="control-label" for="password">Password : </label> <input
                        type="password" id="password" formControlName="password" class="form-control" 
                        required autofocus="autofocus">
                </div>
                
                
                <div class="form-group">
                    <label class="control-label" for="rol"> </label> <input
                        id="rol" type="hidden" formControlName="rol" class="form-control" 
                        autofocus="autofocus">
                </div>
                
                                
                <div class="form-group">
                    <label class="control-label" for="fecha">fecha Nacimiento : </label> <input
                        id="fechaNacimiento" type="date" formControlName="fechaNacimiento" class="form-control" 
                        autofocus="autofocus">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-success">Registrar</button>
                    <span>Si estas registrado inicia sesión aqui</span>
                </div>
            </form>

        </div>
    </div>
</div>

<br><br>
