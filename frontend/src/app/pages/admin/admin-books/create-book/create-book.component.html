<app-header-admin></app-header-admin>

<div class="container">
    
            <h2>Registrar libro</h2>

<div class="row g-5">
            <form  [formGroup]="formNewBook" (submit)="registerBook()"> 
            
                <!-- <div class="form-group">
                    <label class="control-label" for="id"> </label> <input
                        id="id" type="hidden" formControlName="id" class="form-control" 
                        autofocus="autofocus"> 
                </div> -->
                 
                        
                
                <div class="form-group">
                    <label class="control-label" for="nombre">Título</label> 
                    <input id="nombre" type="text" formControlName="nombre" class="form-control">
                    
                </div>
                
                <div class="form-group">
                             
                    <!-- <div formGroupName="autor"> -->
                    <label class="control-label" for="autor">Autor</label> <select formControlName="autor" id="autor">
                        <!-- <select (change)="onChange()"> -->
    		    <option [ngValue]="null">Elegir autor</option>
                @for (autor of autores; track autor.id){
                    
                    <option [ngValue]="autor" >
                    {{ autor.nombre}}
                    </option>
                    }
    		    
    	        </select>
                <button type="button" class="createButton" matButton="elevated" (click)="openDialog('0ms', '0ms')">Autor +</button>
                    </div>
                       <!-- aqui antes <button></button>                 -->
                    
                <!-- </div> -->

                <div class="form-group">
                    <label class="control-label" for="isbn">ISBN</label> <input
                        id="isbn" type="text" formControlName="isbn" class="form-control">
                </div>
                
               <div class="form-group">
                   
                    <!-- <div formGroupName="editorial"> -->
                    <label class="control-label" for="editorial">Editorial</label> <select formControlName="editorial" id="editorial">
                    <option [ngValue]="null" >Elegir editorial</option>
                @for (editorial of editoriales; track editorial){
                    
                    <option [ngValue]="editorial">
                    {{ editorial.nombre}}
                    </option>
                    }
                    </select>
                    <button type="button" class="createButton" matButton="elevated" (click)="openEditorialDialog('0ms', '0ms')">Editorial +</button>
                    </div>
                    
                    
                    <!-- </div> -->
                
                
                <div class="form-group">
                  
                    <!-- <div formGroupName="genero"> -->
                    <label class="control-label" for="genero">Género</label> <select formControlName="genero" id="genero">
                    <option [ngValue]="null" >Elegir genero</option>
                    @for (genero of generos; track genero){
                    
                    <option [ngValue]="genero">
                    {{ genero.nombre}}
                    </option>
                    }
                    </select> 
                    <button type="button" class="createButton" matButton="elevated" (click)="openGenreDialog('0ms', '0ms')">Género +</button>
                    </div>
                   
                <!-- </div> -->
                
                <div class="form-group">
                    <label class="control-label" for="portada">Portada</label> <input
                        type="text" id="portada" formControlName="portada" class="form-control" 
                        (input)="sendImage($event)">
                        
                </div>
                <div class="form-group">
                    <label class="control-label" for="sinopsis">Sinopsis</label> <textarea id="sinopsis" formControlName="sinopsis" class="form-control"></textarea>
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-success">Añadir</button>
                    
                </div>
            </form>

            
            
</div>
<div class="imagen">
<img [src]="url" />
</div>

</div>
