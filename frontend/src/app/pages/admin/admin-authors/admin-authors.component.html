<!-- Header con navegacion para el administrador -->
<app-header-admin></app-header-admin>
<!-- Cuerpo de pagina Administrar autores -->
<div class="administration">
  <h2>Administrar autores</h2>
  <!-- Bucador tabla -->
  <mat-form-field>
    <mat-label>Filtrar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Autor, número de libros" #input>
  </mat-form-field>
  <!-- Tabla con el listado de autores por orden alfabetico -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="author">
      <th mat-header-cell *matHeaderCellDef>Autor</th>
      <td mat-cell *matCellDef="let autor">{{autor.nombre}}</td>
    </ng-container>

    <ng-container matColumnDef="books">
      <th mat-header-cell *matHeaderCellDef>Libros</th>
      <td mat-cell *matCellDef="let autor">{{autor.numeroLibros}}</td>
    </ng-container>

    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let autor" (click)="$event.stopPropagation()">
        <!-- Boton para edicion del autor -->
        <button type="button" (click)="openDialog(autor,'0ms', '0ms')" class="edit-button"><img src="/assets/icons/edit.png"
            class="edit" alt="Editar" />
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let autor">
        @if (autor.numeroLibros === 0) {
        <!-- Dialog para eliminar el registro si no esta asociado a ningun libro -->
        <button type="button" (click)="openDeleteDialog(autor,'0ms', '0ms')" class="delete-button"><img
            src="/assets/icons/bin.png" class="delete" alt="Eliminar" />
        </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let autor; columns: displayedColumns;"></tr>
  </table>
  <!-- Seccion de paginacion de la lista de autores de la tabla -->
  <mat-paginator class="paginator" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[16, 32, 40]"
    aria-label="Select page" (page)="onPageChange($event)">
  </mat-paginator>
</div>
