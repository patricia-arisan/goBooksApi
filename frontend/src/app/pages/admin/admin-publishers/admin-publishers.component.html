<!-- Header con navegacion para el administrador -->
<app-header-admin></app-header-admin>
<!-- Cuerpo de pagina Administrar editoriales -->
<div class="administration">
  <h2>Administrar editoriales</h2>
  <!-- Bucador tabla -->
  <mat-form-field>
    <mat-label>Filtrar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Editorial, número de libros" #input>
  </mat-form-field>
  <!-- Tabla con el listado de editoriales por orden alfabetico -->
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="publisher">
      <th mat-header-cell *matHeaderCellDef>Editorial</th>
      <td mat-cell class="name" *matCellDef="let editorial">{{editorial.nombre}}</td>
    </ng-container>

    <ng-container matColumnDef="books">
      <th mat-header-cell *matHeaderCellDef>Libros</th>
      <td mat-cell class="number" *matCellDef="let editorial">{{editorial.numeroLibros}}</td>
    </ng-container>

    <ng-container matColumnDef="edit">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let editorial" (click)="$event.stopPropagation()">
        <!-- Boton para edicion de la editorial -->
        <button type="button" (click)="openDialog(editorial,'0ms', '0ms')" class="edit-button"><img src="/assets/icons/edit.png"
            class="edit" alt="Editar" /></button>
      </td>
    </ng-container>

    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef> </th>
      <td mat-cell *matCellDef="let editorial">
        @if (editorial.numeroLibros === 0) {
        <!-- Dialog para eliminar el registro si no esta asociado a ningun libro -->
        <button type="button" class="delete-button" (click)="openDeleteDialog(editorial,'0ms', '0ms')"><img
            src="/assets/icons/bin.png" class="delete" alt="Eliminar" />
        </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row (click)="goPublisherBooks(editorial)" *matRowDef="let editorial; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator class="paginator" [pageSize]="pageSize" [pageIndex]="pageIndex" [pageSizeOptions]="[16, 32, 40]"
    aria-label="Select page" (page)="onPageChange($event)">
  </mat-paginator>
</div>
