<app-header-admin></app-header-admin>
<div class="administracion">

<h2>Administrar categorías</h2>


<mat-form-field>
  <mat-label>Filtrar</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Género" #input>
</mat-form-field>

 

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
   
    
  <ng-container matColumnDef="genre" >
    <th mat-header-cell *matHeaderCellDef >Categoría </th>
    
    <td mat-cell *matCellDef="let genero"> {{genero.nombre}} </td>
    
  </ng-container>
  
   <ng-container matColumnDef="edit">
    
    <th mat-header-cell *matHeaderCellDef> </th>
    <td mat-cell *matCellDef="let genero" (click)="$event.stopPropagation()"><button type="button" class="edit-buttom" ><img src="/assets/update/edit.png" class="edit" alt="edit" /></button></td>
    
  </ng-container>
  
   
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row (click)="openDialog(genero,'0ms', '0ms')" *matRowDef="let genero; columns: displayedColumns;"></tr>
   
  </table>

  <mat-paginator class="paginator"
              
              [pageSize]="pageSize"
              [pageIndex]="pageIndex"
              [pageSizeOptions]="[16, 32, 40]"
              aria-label="Select page"
              (page)="onPageChange($event)">
</mat-paginator> 



  </div>
